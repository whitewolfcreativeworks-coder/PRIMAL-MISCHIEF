# Publishes the static client to GitHub Pages. Single-player works with no server.
# For online play, set the repository variable PM_SERVER_URL (e.g. wss://your-server/ws).
name: Deploy client to GitHub Pages
on:
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @pm/client
        env: { VITE_SERVER_URL: '${{ vars.PM_SERVER_URL }}' }
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/client/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
